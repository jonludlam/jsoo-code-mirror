<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collaborative Editing</title>
<style>
  #server {
    width: max-content;
    padding: 2px 13px;
    background: #85a;
    color: white;
    border-radius: 8px;
  }
  #server select, #server button {
    border: 1px solid white;
    border-radius: 3px;
    color: white;
    font: inherit;
    background: inherit;
  }
  #latency option {
    background: #85a;
  }
  #editors {
    padding-top: 10px;
    overflow: hidden;
  }
  .editor {
    margin-top: 10px;
    padding-left: 80px;
    position: relative;
  }
  .editor:before {
    position: absolute;
    left: 10px; top: -1000px; bottom: calc(100% - 13px); width: 80px;
    border-left: 5px solid #85a;
    border-bottom: 5px solid #85a;
    border-radius: 0 0 0 18px;
    content: "";
    pointer-events: none;
  }
  .editor.cut:before {
    width: 40px;
  }
  .cut-control {
    position: absolute;
    left: 35px; top: 15px;
  }
  .cm-editor {
    border: 3px solid #85a;
    border-radius: 2px;
  }
  .cm-editor .cm-scroller {
    height: 70px;
  }
</style>
</head>
<body>
<h1>Collaborative Editing</h1>
<p>Ported from <a href="https://codemirror.net/examples/collab/">codemirror.net/examples/collab</a>: the authority is <code>worker/worker.ml</code>, a second program, run as a web worker.</p>
<div id=server>
  <span style="font-size: 150%; font-weight: bold">Server</span>
  <label style="margin-left: 1em">Latency ≈ <select id=latency>
    <option value=10>10ms</option>
    <option value=50 selected>50ms</option>
    <option value=250>250ms</option>
  </select></label>
  <button id=addpeer style="margin-left: 1em">Add peer</button>
</div>
<div id=editors></div>
<script src="selfcheck.bc.js"></script>
</body>
</html>
